# Build every module, replay every proof in the independent kernel checker,
# audit the axioms of every named theorem, and confirm every false control is
# rejected. A green badge means all four passed on the exact commit shown.
name: Lean proof check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Free disk space (the full Mathlib cache is several GB)
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install the pinned Lean toolchain
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the cache using the committed dependency lockfile
        run: |
          set -euo pipefail
          lean --version
          lake exe cache get
          git diff --exit-code -- lake-manifest.json
          df -h /

      - name: Build, replay, audit and test the verifier
        run: python3 scripts/check_review.py

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-evidence
          path: |
            build.log
            verification/
            lake-manifest.json
          if-no-files-found: warn
          retention-days: 90
